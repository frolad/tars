name: tests

on: [push, pull_request]

jobs:
  hooks:
    name: hook tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.x"]
        include:
          # Apple's own python3 on a Mac without Homebrew is 3.9
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest tests.test_sttp_hooks

  mod:
    name: mod tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # The channel users get by default, so a Claude Code release that breaks the mod shows at the next push
      - if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://claude.ai/install.ps1))) latest
          "$HOME\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: claude plugin test mods/tars-mod
